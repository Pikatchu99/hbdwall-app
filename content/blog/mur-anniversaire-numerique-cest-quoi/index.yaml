title: Mur d'anniversaire numérique — c'est quoi et pourquoi ça touche plus qu'un cadeau
description: >-
  Un mur d'anniversaire numérique, c'est la meilleure alternative à la carte
  collective : une page collaborative où tes proches laissent tous un message.
  Voilà comment ça marche et pourquoi l'effet émotionnel est sans comparaison.
excerpt: >-
  Plus de carte à faire circuler, plus de coordination. Un mur numérique se
  crée en 5 minutes et devient un souvenir qu'on relit dans 2 ans.
