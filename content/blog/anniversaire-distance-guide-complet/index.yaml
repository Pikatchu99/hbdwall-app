title: Fêter l'anniversaire d'un ami à distance — ce qui marche vraiment
description: >-
  Ton ami est à l'étranger pour son anniversaire ? Un colis arrive en retard,
  un Zoom ressemble à une réunion. Voilà les idées qui touchent vraiment,
  même à 3000 km.
excerpt: >-
  La distance est un problème logistique, pas émotionnel. Parfois elle rend
  le geste encore plus fort. Voilà comment.
publishedAt: '2026-05-13'
category: distance
